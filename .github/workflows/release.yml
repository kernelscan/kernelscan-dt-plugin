name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release + upload the JAR asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract compile classpath
        run: make libs

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Package versioned JAR
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp build/kernelscan-dt-plugin.jar "build/kernelscan-dt-plugin-${VER}.jar"
          sha256sum "build/kernelscan-dt-plugin-${VER}.jar" | tee "build/kernelscan-dt-plugin-${VER}.jar.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES="$(cat <<EOF
          Automated release built by CI from tag \`${GITHUB_REF_NAME}\` — Dependency-Track 5.0.2, Java 25, ${{ github.sha }}.

          **Install:** mount \`kernelscan-dt-plugin-${VER}.jar\` into the apiserver's \`lib/\`, restart, configure under Administration → Analyzers with your \`ks_live_…\` API key. See the README and SECURITY.md.

          A \`.sha256\` checksum is attached alongside the JAR.
          EOF
          )"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "build/kernelscan-dt-plugin-${VER}.jar" \
              "build/kernelscan-dt-plugin-${VER}.jar.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "build/kernelscan-dt-plugin-${VER}.jar" \
              "build/kernelscan-dt-plugin-${VER}.jar.sha256" \
              --title "${GITHUB_REF_NAME} — KernelScan analyzer for Dependency-Track v5" \
              --notes "$NOTES" \
              --verify-tag
          fi
